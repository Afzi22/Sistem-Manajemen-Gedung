<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barang Masuk · E-Gedung</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../aseets/css/tokens.css">
  <link rel="stylesheet" href="../aseets/css/base.css">
  <link rel="stylesheet" href="../aseets/css/components.css">
  <link rel="stylesheet" href="../aseets/css/pages.css">
</head>
<body data-root=".." data-active="in"
      data-title="Barang Masuk"
      data-subtitle="Catat penerimaan material dan suku cadang dari supplier. Stok gedung bertambah otomatis.">

  <div id="page-content">
    <div class="tx-layout">

      <!-- ===== Form ===== -->
      <section class="card" aria-labelledby="form-title">
        <div class="card__header">
          <h2 class="card__title" id="form-title">Form barang masuk</h2>
        </div>
        <div class="card__body">
          <form class="form" id="tx-form" novalidate>

            <div class="field">
              <label class="label" for="sku">Barang <span class="label__req" aria-hidden="true">*</span></label>
              <select class="select" id="sku" name="sku" required>
                <option value="" disabled selected>Pilih barang…</option>
              </select>
            </div>

            <div class="field">
              <label class="label" for="supplier_id">Supplier <span class="label__req" aria-hidden="true">*</span></label>
              <select class="select" id="supplier_id" name="supplier_id" required>
                <option value="" disabled selected>Pilih supplier…</option>
              </select>
            </div>

            <div class="form-row form-row--2">
              <div class="field">
                <label class="label" for="quantity">Jumlah masuk <span class="label__req" aria-hidden="true">*</span></label>
                <input class="input" type="number" id="quantity" name="quantity" min="1" step="1"
                       inputmode="numeric" placeholder="Contoh: 10" required aria-describedby="quantity-hint">
                <p class="field__hint" id="quantity-hint">Bilangan bulat, minimal 1.</p>
              </div>

              <div class="field">
                <label class="label" for="ref">No. surat jalan</label>
                <input class="input" type="text" id="ref" name="ref" maxlength="40"
                       placeholder="Contoh: SJ-2610-045" autocomplete="off" aria-describedby="ref-hint">
                <p class="field__hint" id="ref-hint">Opsional.</p>
              </div>
            </div>

            <div class="field">
              <label class="label" for="note">Catatan</label>
              <textarea class="textarea" id="note" name="note" maxlength="200"
                        placeholder="Contoh: Pengadaan rutin bulanan" aria-describedby="note-hint"></textarea>
              <p class="field__hint" id="note-hint">Opsional, maksimal 200 karakter.</p>
            </div>

            <div class="stock-preview" id="stock-preview" aria-live="polite" hidden>
              <div class="stock-preview__col">
                <span class="stock-preview__label">Stok saat ini</span>
                <span class="stock-preview__value" id="sp-current">–</span>
              </div>
              <span class="stock-preview__arrow" id="sp-arrow"></span>
              <div class="stock-preview__col">
                <span class="stock-preview__label">Stok setelah masuk</span>
                <span class="stock-preview__value stock-preview__after" id="sp-after">–</span>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn--primary">Simpan barang masuk</button>
              <button type="reset" class="btn btn--ghost" id="reset-btn">Kosongkan</button>
            </div>
          </form>
        </div>
      </section>

      <!-- ===== Riwayat terbaru ===== -->
      <section class="card" aria-labelledby="recent-title">
        <div class="card__header">
          <h2 class="card__title" id="recent-title">Barang masuk terbaru</h2>
        </div>

        <div class="table-wrap" id="recent-wrap">
          <table class="table">
            <thead>
              <tr>
                <th scope="col">Waktu</th>
                <th scope="col">Barang</th>
                <th scope="col">Supplier</th>
                <th scope="col" class="num">Jumlah</th>
              </tr>
            </thead>
            <tbody id="recent-body"></tbody>
          </table>
        </div>

        <div class="empty" id="recent-empty" hidden>
          <p class="empty__title">Belum ada transaksi masuk</p>
          <p>Transaksi yang kamu catat akan muncul di sini.</p>
        </div>
      </section>

    </div>
  </div>

  <script src="../aseets/js/app.js"></script>
  <script>
    EG.init(function () {
      var store = EG.store, esc = EG.esc;

      var form     = document.getElementById('tx-form');
      var skuEl    = document.getElementById('sku');
      var supEl    = document.getElementById('supplier_id');
      var qtyEl    = document.getElementById('quantity');
      var refEl    = document.getElementById('ref');
      var noteEl   = document.getElementById('note');
      var preview  = document.getElementById('stock-preview');
      var spNow    = document.getElementById('sp-current');
      var spAfter  = document.getElementById('sp-after');

      document.getElementById('sp-arrow').innerHTML = EG.icon('arrow-right');

      /* Isi dropdown */
      function fillSelects() {
        var keepSku = skuEl.value, keepSup = supEl.value;
        skuEl.innerHTML = '<option value="" disabled selected>Pilih barang…</option>' +
          store.getItems().map(function (i) {
            return '<option value="' + esc(i.sku) + '" data-stock="' + i.qty + '" data-unit="' + esc(i.unit) + '">' +
                   esc(i.sku) + ' — ' + esc(i.name) + '</option>';
          }).join('');
        supEl.innerHTML = '<option value="" disabled selected>Pilih supplier…</option>' +
          store.getSuppliers().map(function (s) {
            return '<option value="' + s.id + '">' + esc(s.name) + ' (' + esc(s.category) + ')</option>';
          }).join('');
        if (keepSku) skuEl.value = keepSku;
        if (keepSup) supEl.value = keepSup;
      }

      /* Pratinjau stok: stok saat ini -> stok setelah barang masuk */
      function updatePreview() {
        var opt = skuEl.options[skuEl.selectedIndex];
        if (!opt || !opt.dataset.stock) { preview.hidden = true; return; }
        var stock = parseInt(opt.dataset.stock, 10);
        var unit  = opt.dataset.unit || '';
        var add   = parseInt(qtyEl.value, 10);
        if (isNaN(add) || add < 0) add = 0;
        spNow.textContent   = EG.formatQty(stock) + ' ' + unit;
        spAfter.textContent = EG.formatQty(stock + add) + ' ' + unit;
        preview.hidden = false;
      }

      /* Riwayat terbaru (8 baris) */
      function renderRecent() {
        var rows = store.getTransactions('IN').slice(0, 8);
        document.getElementById('recent-wrap').hidden = rows.length === 0;
        document.getElementById('recent-empty').hidden = rows.length !== 0;
        document.getElementById('recent-body').innerHTML = rows.map(function (t) {
          var item = store.findItem(t.sku) || { name: t.sku, unit: '' };
          var sup  = store.findSupplier(t.supplierId);
          var sub  = t.ref ? '<span class="table__sub">' + esc(t.ref) + '</span>' : '';
          return '<tr>' +
            '<td>' + EG.formatDateTime(t.date) + '</td>' +
            '<td>' + esc(item.name) + '<span class="table__sub">' + esc(t.sku) + '</span></td>' +
            '<td>' + (sup ? esc(sup.name) : '-') + sub + '</td>' +
            '<td class="num"><span class="qty--in">+' + EG.formatQty(t.qty) + '</span>' +
              '<span class="table__sub">' + esc(item.unit) + '</span></td>' +
            '</tr>';
        }).join('');
      }

      function validate() {
        var ok = true;
        var sku = skuEl.value, sup = supEl.value, qtyRaw = qtyEl.value.trim();

        var m1 = store.findItem(sku) ? '' : 'Pilih barang yang valid.';
        EG.fieldError(skuEl, m1); if (m1) ok = false;

        var m2 = store.findSupplier(sup) ? '' : 'Pilih supplier.';
        EG.fieldError(supEl, m2); if (m2) ok = false;

        var qty = /^\d+$/.test(qtyRaw) ? parseInt(qtyRaw, 10) : NaN;
        var m3 = (isNaN(qty) || qty < 1) ? 'Jumlah harus bilangan bulat minimal 1.' : '';
        EG.fieldError(qtyEl, m3); if (m3) ok = false;

        return ok ? { sku: sku, supplierId: sup, qty: qty, ref: refEl.value.trim(), note: noteEl.value.trim() } : null;
      }

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var data = validate();
        if (!data) {
          EG.flash('error', 'Data belum lengkap. Periksa kolom yang ditandai.');
          var first = form.querySelector('.is-invalid');
          if (first) first.focus();
          return;
        }
        try {
          var item = store.findItem(data.sku);
          store.recordIn(data);
          EG.flash('success', 'Barang masuk berhasil dicatat: +' + EG.formatQty(data.qty) + ' ' + item.unit +
                              ' ' + item.name + '. Stok sudah bertambah.');
          form.reset();
          ['sku', 'supplier_id', 'quantity'].forEach(function (id) { EG.fieldError(document.getElementById(id), ''); });
          fillSelects();
          updatePreview();
          renderRecent();
        } catch (err) {
          EG.flash('error', err.message);
        }
      });

      form.addEventListener('reset', function () {
        setTimeout(function () {
          ['sku', 'supplier_id', 'quantity'].forEach(function (id) { EG.fieldError(document.getElementById(id), ''); });
          updatePreview();
        }, 0);
      });

      skuEl.addEventListener('change', updatePreview);
      qtyEl.addEventListener('input', updatePreview);

      fillSelects();

      /* Dari halaman supplier: ?supplier=ID memilih supplier otomatis */
      var preset = new URLSearchParams(window.location.search).get('supplier');
      if (preset && store.findSupplier(preset)) supEl.value = String(Number(preset));

      updatePreview();
      renderRecent();
    });
  </script>
</body>
</html>
